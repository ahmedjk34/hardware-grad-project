<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="772" viewBox="0 0 1180 772"><rect width="1180" height="772" fill="white"/><text x="30" y="36" font-family="Times New Roman, Georgia, serif" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">Figure — Arduino Uno, feeder controller: complete wiring</text><text x="30" y="57" font-family="Times New Roman, Georgia, serif" font-size="10.5" fill="#5e5c64" text-anchor="start" font-weight="normal" font-style="italic">Every pin transcribed from arduino/belt_v1/belt_v1.ino</text><rect x="478.0" y="96" width="224" height="236" rx="6" fill="#e8eef7" stroke="#1a365b" stroke-width="2"/><text x="590.0" y="122" font-family="Times New Roman, Georgia, serif" font-size="13.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Arduino Uno</text><text x="590.0" y="139" font-family="Times New Roman, Georgia, serif" font-size="9" fill="#5e5c64" text-anchor="middle" font-weight="normal" font-style="normal">FEEDER  —  firmware belt_v1, protocol 2</text><circle cx="478.0" cy="158" r="3.2" fill="#1a365b"/><text x="468.0" y="153" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="9.5" fill="#1a365b" text-anchor="end" font-weight="bold" font-style="normal">pin 2</text><line x1="478.0" y1="158" x2="386.0" y2="158" stroke="#1a5fb4" stroke-width="1.6" stroke-linecap="round"/><rect x="154.0" y="142.0" width="232" height="32" rx="3" fill="#ffffff" stroke="#5e5c64" stroke-width="1"/><text x="163.0" y="157" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">A4988  DIR</text><text x="163.0" y="170" font-family="Times New Roman, Georgia, serif" font-size="8.5" fill="#5e5c64" text-anchor="start" font-weight="normal" font-style="italic">belt direction</text><circle cx="478.0" cy="200" r="3.2" fill="#1a365b"/><text x="468.0" y="195" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="9.5" fill="#1a365b" text-anchor="end" font-weight="bold" font-style="normal">pin 3</text><line x1="478.0" y1="200" x2="386.0" y2="200" stroke="#1a5fb4" stroke-width="1.6" stroke-linecap="round"/><rect x="154.0" y="184.0" width="232" height="32" rx="3" fill="#ffffff" stroke="#5e5c64" stroke-width="1"/><text x="163.0" y="199" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">A4988  STEP</text><text x="163.0" y="212" font-family="Times New Roman, Georgia, serif" font-size="8.5" fill="#5e5c64" text-anchor="start" font-weight="normal" font-style="italic">NEMA17 conveyor, 325 steps/s</text><circle cx="702.0" cy="158" r="3.2" fill="#1a365b"/><text x="712.0" y="153" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="9.5" fill="#1a365b" text-anchor="start" font-weight="bold" font-style="normal">pin 4</text><line x1="702.0" y1="158" x2="794.0" y2="158" stroke="#1a5fb4" stroke-width="1.6" stroke-linecap="round"/><rect x="794.0" y="142.0" width="232" height="32" rx="3" fill="#ffffff" stroke="#5e5c64" stroke-width="1"/><text x="803.0" y="157" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">EXIT HC-SR04  TRIG</text><text x="803.0" y="170" font-family="Times New Roman, Georgia, serif" font-size="8.5" fill="#5e5c64" text-anchor="start" font-weight="normal" font-style="italic">container exit</text><circle cx="702.0" cy="200" r="3.2" fill="#1a365b"/><text x="712.0" y="195" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="9.5" fill="#1a365b" text-anchor="start" font-weight="bold" font-style="normal">pin 5</text><line x1="702.0" y1="200" x2="794.0" y2="200" stroke="#1a5fb4" stroke-width="1.6" stroke-linecap="round"/><rect x="794.0" y="184.0" width="232" height="32" rx="3" fill="#ffffff" stroke="#5e5c64" stroke-width="1"/><text x="803.0" y="199" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">EXIT HC-SR04  ECHO</text><text x="803.0" y="212" font-family="Times New Roman, Georgia, serif" font-size="8.5" fill="#5e5c64" text-anchor="start" font-weight="normal" font-style="italic">block left the hopper</text><circle cx="702.0" cy="242" r="3.2" fill="#1a365b"/><text x="712.0" y="237" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="9.5" fill="#1a365b" text-anchor="start" font-weight="bold" font-style="normal">pin 8</text><line x1="702.0" y1="242" x2="794.0" y2="242" stroke="#1a5fb4" stroke-width="1.6" stroke-linecap="round"/><rect x="794.0" y="226.0" width="232" height="32" rx="3" fill="#ffffff" stroke="#5e5c64" stroke-width="1"/><text x="803.0" y="241" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">STAGE IR  OUT</text><text x="803.0" y="254" font-family="Times New Roman, Georgia, serif" font-size="8.5" fill="#5e5c64" text-anchor="start" font-weight="normal" font-style="italic">block reached [0,0]</text><circle cx="702.0" cy="284" r="3.2" fill="#1a365b"/><text x="712.0" y="279" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="9.5" fill="#1a365b" text-anchor="start" font-weight="bold" font-style="normal">pin 6</text><line x1="702.0" y1="284" x2="794.0" y2="284" stroke="#e66100" stroke-width="1.6" stroke-linecap="round"/><rect x="794.0" y="268.0" width="232" height="32" rx="3" fill="#ffffff" stroke="#5e5c64" stroke-width="1"/><text x="803.0" y="283" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">ALIGNMENT SERVO</text><text x="803.0" y="296" font-family="Times New Roman, Georgia, serif" font-size="8.5" fill="#5e5c64" text-anchor="start" font-weight="normal" font-style="italic">rest 90 deg / nudge 120 deg</text><circle cx="702.0" cy="326" r="3.2" fill="#1a365b"/><text x="712.0" y="321" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="9.5" fill="#1a365b" text-anchor="start" font-weight="bold" font-style="normal">pin 12</text><line x1="702.0" y1="326" x2="794.0" y2="326" stroke="#e66100" stroke-width="1.6" stroke-linecap="round"/><rect x="794.0" y="310.0" width="232" height="32" rx="3" fill="#ffffff" stroke="#5e5c64" stroke-width="1"/><text x="803.0" y="325" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">CONTAINER SERVO</text><text x="803.0" y="338" font-family="Times New Roman, Georgia, serif" font-size="8.5" fill="#5e5c64" text-anchor="start" font-weight="normal" font-style="italic">closed 20 / stage 90 / open 160</text><line x1="590.0" y1="332" x2="590.0" y2="378" stroke="#3d3846" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 3"/><rect x="472.0" y="378" width="236" height="30" rx="3" fill="#ffffff" stroke="#1a365b" stroke-width="1.4"/><text x="590.0" y="398" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">Raspberry Pi 5   (USB: power + serial)</text><text x="76" y="449" font-family="Times New Roman, Georgia, serif" font-size="9.5" fill="#c01c28" text-anchor="start" font-weight="bold" font-style="normal">12 V  —  A4988 motor supply</text><line x1="76" y1="456" x2="1104" y2="456" stroke="#c01c28" stroke-width="2.8" stroke-linecap="round"/><text x="76" y="483" font-family="Times New Roman, Georgia, serif" font-size="9.5" fill="#e66100" text-anchor="start" font-weight="bold" font-style="normal">5 V  —  from LM2596 — both servos, exit HC-SR04, stage IR, A4988 logic / Vref</text><line x1="76" y1="490" x2="1104" y2="490" stroke="#e66100" stroke-width="2.8" stroke-linecap="round"/><text x="76" y="517" font-family="Times New Roman, Georgia, serif" font-size="9.5" fill="#3d3846" text-anchor="start" font-weight="bold" font-style="normal">GND  —  common ground, shared with the Mega side</text><line x1="76" y1="524" x2="1104" y2="524" stroke="#3d3846" stroke-width="2.8" stroke-linecap="round"/><rect x="76" y="574" width="1028" height="32" rx="4" fill="#fff6da" stroke="#c9a227" stroke-width="1"/><text x="90" y="594" font-family="Times New Roman, Georgia, serif" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">A4988 ENABLE is tied directly to GROUND, not driven by the Arduino. There is no enable pin in the firmware.</text><rect x="76" y="616" width="1028" height="64" rx="4" fill="#fff6da" stroke="#c9a227" stroke-width="1"/><text x="90" y="636" font-family="Times New Roman, Georgia, serif" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">EXIT ULTRASONIC SENSOR: detection threshold is distance &lt; 10.0 cm. The echo timeout is 30 ms and reports</text><text x="90" y="652" font-family="Times New Roman, Georgia, serif" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">"no echo", which is never treated as a detection — 'I heard nothing' and 'nothing is there' are different.</text><text x="90" y="668" font-family="Times New Roman, Georgia, serif" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">The stage IR sensor is a digital active-low input by default; it reports detected/not detected, not distance.</text><rect x="76" y="690" width="1028" height="48" rx="4" fill="#fff6da" stroke="#c9a227" stroke-width="1"/><text x="90" y="710" font-family="Times New Roman, Georgia, serif" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">SERVO POWER comes from the 5 V rail, not the Uno's 5 V pin. USB to the Raspberry Pi carries both the</text><text x="90" y="726" font-family="Times New Roman, Georgia, serif" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">serial link (9600 8N1, protocol 2) and board power. This board has NO connection to the Arduino MEGA.</text></svg>