idth="1"/><text x="803.0" y="157" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">LIMIT SW  X</text><text x="803.0" y="170" font-family="Times New Roman, Georgia, serif" font-size="8.5" fill="#5e5c64" text-anchor="start" font-weight="normal" font-style="italic">NC, pull-up  |  X home / zero</text><circle cx="702.0" cy="200" r="3.2" fill="#1a365b"/><text x="712.0" y="195" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="9.5" fill="#1a365b" text-anchor="start" font-weight="bold" font-style="normal">pin 31</text><line x1="702.0" y1="200" x2="794.0" y2="200" stroke="#1a5fb4" stroke-width="1.6" stroke-linecap="round"/><rect x="794.0" y="184.0" width="232" height="32" rx="3" fill="#ffffff" stroke="#5e5c64" stroke-width="1"/><text x="803.0" y="199" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">LIMIT SW  Y</text><text x="803.0" y="212" font-family="Times New Roman, Georgia, serif" font-size="8.5" fill="#5e5c64" text-anchor="start" font-weight="normal" font-style="italic">NC, pull-up  |  Y home / zero</text><circle cx="702.0" cy="242" r="3.2" fill="#1a365b"/><text x="712.0" y="237" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="9.5" fill="#1a365b" text-anchor="start" font-weight="bold" font-style="normal">pin 28</text><line x1="702.0" y1="242" x2="794.0" y2="242" stroke="#1a5fb4" stroke-width="1.6" stroke-linecap="round"/><rect x="794.0" y="226.0" width="232" height="32" rx="3" fill="#ffffff" stroke="#5e5c64" stroke-width="1"/><text x="803.0" y="241" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">LIMIT SW  Z bottom</text><text x="803.0" y="254" font-family="Times New Roman, Georgia, serif" font-size="8.5" fill="#5e5c64" text-anchor="start" font-weight="normal" font-style="italic">NC, pull-up  |  Z zero, GROUND ref</text><circle cx="702.0" cy="284" r="3.2" fill="#1a365b"/><text x="712.0" y="279" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="9.5" fill="#1a365b" text-anchor="start" font-weight="bold" font-style="normal">pin 29</text><line x1="702.0" y1="284" x2="794.0" y2="284" stroke="#1a5fb4" stroke-width="1.6" stroke-linecap="round"/><rect x="794.0" y="268.0" width="232" height="32" rx="3" fill="#ffffff" stroke="#5e5c64" stroke-width="1"/><text x="803.0" y="283" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">LIMIT SW  Z top</text><text x="803.0" y="296" font-family="Times New Roman, Georgia, serif" font-size="8.5" fill="#5e5c64" text-anchor="start" font-weight="normal" font-style="italic">NC, pull-up  |  far-end stop only</text><circle cx="702.0" cy="326" r="3.2" fill="#1a365b"/><text x="712.0" y="321" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="9.5" fill="#1a365b" text-anchor="start" font-weight="bold" font-style="normal">pin 6</text><line x1="702.0" y1="326" x2="794.0" y2="326" stroke="#e66100" stroke-width="1.6" stroke-linecap="round"/><rect x="794.0" y="310.0" width="232" height="32" rx="3" fill="#ffffff" stroke="#5e5c64" stroke-width="1"/><text x="803.0" y="325" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">GRIPPER SERVO</text><text x="803.0" y="338" font-family="Times New Roman, Georgia, serif" font-size="8.5" fill="#5e5c64" text-anchor="start" font-weight="normal" font-style="italic">OPEN 0 deg / CLOSE 52 deg</text><circle cx="702.0" cy="368" r="3.2" fill="#1a365b"/><text x="712.0" y="363" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="9.5" fill="#1a365b" text-anchor="start" font-weight="bold" font-style="normal">pin 38</text><line x1="702.0" y1="368" x2="794.0" y2="368" stroke="#e66100" stroke-width="1.6" stroke-linecap="round"/><rect x="794.0" y="352.0" width="232" height="32" rx="3" fill="#ffffff" stroke="#5e5c64" stroke-width="1"/><text x="803.0" y="367" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">ULN2003  IN1</text><text x="803.0" y="380" font-family="Times New Roman, Georgia, serif" font-size="8.5" fill="#5e5c64" text-anchor="start" font-weight="normal" font-style="italic">black</text><circle cx="702.0" cy="410" r="3.2" fill="#1a365b"/><text x="712.0" y="405" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="9.5" fill="#1a365b" text-anchor="start" font-weight="bold" font-style="normal">pin 36</text><line x1="702.0" y1="410" x2="794.0" y2="410" stroke="#e66100" stroke-width="1.6" stroke-linecap="round"/><rect x="794.0" y="394.0" width="232" height="32" rx="3" fill="#ffffff" stroke="#5e5c64" stroke-width="1"/><text x="803.0" y="409" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">ULN2003  IN2</text><text x="803.0" y="422" font-family="Times New Roman, Georgia, serif" font-size="8.5" fill="#5e5c64" text-anchor="start" font-weight="normal" font-style="italic">green</text><circle cx="702.0" cy="452" r="3.2" fill="#1a365b"/><text x="712.0" y="447" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="9.5" fill="#1a365b" text-anchor="start" font-weight="bold" font-style="normal">pin 39</text><line x1="702.0" y1="452" x2="794.0" y2="452" stroke="#e66100" stroke-width="1.6" stroke-linecap="round"/><rect x="794.0" y="436.0" width="232" height="32" rx="3" fill="#ffffff" stroke="#5e5c64" stroke-width="1"/><text x="803.0" y="451" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">ULN2003  IN3</text><text x="803.0" y="464" font-family="Times New Roman, Georgia, serif" font-size="8.5" fill="#5e5c64" text-anchor="start" font-weight="normal" font-style="italic">blue</text><circle cx="702.0" cy="494" r="3.2" fill="#1a365b"/><text x="712.0" y="489" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="9.5" fill="#1a365b" text-anchor="start" font-weight="bold" font-style="normal">pin 37</text><line x1="702.0" y1="494" x2="794.0" y2="494" stroke="#e66100" stroke-width="1.6" stroke-linecap="round"/><rect x="794.0" y="478.0" width="232" height="32" rx="3" fill="#ffffff" stroke="#5e5c64" stroke-width="1"/><text x="803.0" y="493" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">ULN2003  IN4</text><text x="803.0" y="506" font-family="Times New Roman, Georgia, serif" font-size="8.5" fill="#5e5c64" text-anchor="start" font-weight="normal" font-style="italic">red</text><line x1="590.0" y1="500" x2="590.0" y2="546" stroke="#3d3846" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 3"/><rect x="472.0" y="546" width="236" height="30" rx="3" fill="#ffffff" stroke="#1a365b" stroke-width="1.4"/><text x="590.0" y="566" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">Raspberry Pi 5   (USB: power + serial)</text><text x="76" y="617" font-family="Times New Roman, Georgia, serif" font-size="9.5" fill="#c01c28" text-anchor="start" font-weight="bold" font-style="normal">12 V  —  motor supply for TB6600 #1, #2, #3</text><line x1="76" y1="624" x2="1104" y2="624" stroke="#c01c28" stroke-width="2.8" stroke-linecap="round"/><text x="76" y="651" font-family="Times New Roman, Georgia, serif" font-size="9.5" fill="#e66100" text-anchor="start" font-weight="bold" font-style="normal">5 V  —  from LM2596 — gripper servo, ULN2003 / 28BYJ-48</text><line x1="76" y1="658" x2="1104" y2="658" stroke="#e66100" stroke-width="2.8" stroke-linecap="round"/><text x="76" y="685" font-family="Times New Roman, Georgia, serif" font-size="9.5" fill="#3d3846" text-anchor="start" font-weight="bold" font-style="normal">GND  —  common ground: PSU, buck converter, board, all drivers, all switches</text><line x1="76" y1="692" x2="1104" y2="692" stroke="#3d3846" stroke-width="2.8" stroke-linecap="round"/><rect x="76" y="742" width="1028" height="48" rx="4" fill="#fff6da" stroke="#c9a227" stroke-width="1"/><text x="90" y="762" font-family="Times New Roman, Georgia, serif" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">COIL ORDER: the Stepper library is constructed IN1, IN3, IN2, IN4  =  pins 38, 39, 36, 37.</text><text x="90" y="778" font-family="Times New Roman, Georgia, serif" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Wiring the ULN2003 in numerical pin order (36, 37, 38, 39) gives a motor that buzzes and does not turn.</text><rect x="76" y="800" width="1028" height="64" rx="4" fill="#fff6da" stroke="#c9a227" stroke-width="1"/><text x="90" y="820" font-family="Times New Roman, Georgia, serif" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">LIMIT SWITCHES: all four are plain micro switches, normally closed, one leg to the pin and one to GND,</text><text x="90" y="836" font-family="Times New Roman, Georgia, serif" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">read through the AVR internal pull-ups. A broken wire then reads as a tripped switch and stops the axis,</text><text x="90" y="852" font-family="Times New Roman, Georgia, serif" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">which is the safe failure. Pin 29 stops the Z axis but does NOT redefine zero; pin 28 is Z's zero.</text><rect x="76" y="874" width="1028" height="48" rx="4" fill="#fff6da" stroke="#c9a227" stroke-width="1"/><text x="90" y="894" font-family="Times New Roman, Georgia, serif" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">SERVO AND STEPPER POWER come from the 5 V rail, not from the board's own 5 V pin.</text><text x="90" y="910" font-family="Times New Roman, Georgia, serif" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">USB to the Raspberry Pi carries both the serial link (9600 8N1) and board power.</text></svg>